name: Odyssey DEV contract gate

"on":
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-surface:
    name: E2 E3 P4 contracts (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the change under review
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check Python lint and format
        run: |
          ruff check odyssey_apps odyssey_core odyssey_runtime scripts tests
          ruff format --check odyssey_apps odyssey_core odyssey_runtime scripts tests

      - name: Validate agent skills, compact roadmap and document links
        run: python scripts/odyssey_docs_guard.py

      - name: Enforce human-approved invariants and block false live acceptance
        run: python scripts/odyssey_acceptance_contracts.py

      # A Draft PR may iterate offline. A semantic PR marked ready for review
      # cannot be promoted with mocks or an unaccepted active architecture stage.
      - name: Block ready semantic PR without app GPT E2E and four audits
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.draft) }}
        env:
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
              odyssey_core odyssey_apps odyssey_runtime odyssey_web workflows config)"
          if [[ -n "$changed" ]]; then
            python scripts/odyssey_acceptance_contracts.py --require-review-stage-accepted
          else
            echo 'No semantic runtime/app/web/config source changes in this commit range'
          fi

      - name: Cross-surface regression suite without credentials
        run: python scripts/odyssey_cross_surface_gate.py --output /tmp/odyssey-dev-cross-surface-gate.json

      - name: Validate NoteSchema
        run: python scripts/validate_note_schema.py

# An offline PASS is only regression evidence. This workflow must NEVER
# be presented as browser+n8n+GPT+Markdown+UI acceptance or permission to deploy.
# The original python-ci.yml continues to own the full test run on main.
