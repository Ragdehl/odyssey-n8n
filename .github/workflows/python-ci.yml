name: Python CI

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-ci:
    name: Python deterministic checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install development requirements
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check odyssey_core scripts tests

      - name: Check formatting
        run: ruff format --check odyssey_core scripts tests

      - name: Run tests
        run: pytest

      - name: Validate canonical note schema
        run: python scripts/validate_note_schema.py
