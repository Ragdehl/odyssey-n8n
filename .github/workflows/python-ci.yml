name: Python CI

"on":
  # Reuse the same strict full-suite job for both integration PRs. The DEV
  # cross-surface job is a selected regression subset, not full-suite proof.
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-ci:
    name: Python deterministic checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install development requirements
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check odyssey_apps odyssey_core odyssey_runtime scripts tests

      - name: Check formatting
        run: ruff format --check odyssey_apps odyssey_core odyssey_runtime scripts tests

      # User-approved invariants cannot vanish from refactors or get marked
      # DEV-ready on the strength of local tests alone.
      - name: Validate agent skills, compact roadmap and document links
        run: python scripts/odyssey_docs_guard.py

      - name: Validate user invariant acceptance ledger
        run: python scripts/odyssey_acceptance_contracts.py

      # Shared E2/E3/Tasks/Work Sessions contracts must pass independently of
      # historical frozen benchmark gates. No API credentials are forwarded.
      - name: Cross-surface mutation regression gate
        env:
          ODYSSEY_REVIEW_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/odyssey_cross_surface_gate.py --output /tmp/odyssey-cross-surface-ci.json

      - name: Run tests
        run: pytest --cov=odyssey_apps --cov=odyssey_core --cov=odyssey_runtime --cov-report=xml:coverage.xml

      - name: Check Odyssey web JavaScript
        run: |
          node --check odyssey_web/client.js
          node --check odyssey_web/app.js
          node --check odyssey_web/notes.js
          node --check odyssey_web/notes-client.js
          node --test --experimental-test-coverage --test-coverage-lines=80 tests/odyssey_web_client.test.mjs
          node --test tests/odyssey_web_app.test.mjs
          node --test tests/odyssey_web_notes.test.mjs

      - name: Validate canonical note schema
        run: python scripts/validate_note_schema.py

      # Sonar is a main-branch quality service; the full offline test job is
      # independent and mandatory on dev PRs, with no continue-on-error.
      - name: SonarQube Cloud scan
        if: ${{ github.event_name == 'push' || github.base_ref == 'main' }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
