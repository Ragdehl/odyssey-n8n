name: Python CI

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-ci:
    name: Python deterministic checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install development requirements
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check odyssey_core scripts tests

      - name: Check formatting
        run: ruff format --check odyssey_core scripts tests

      - name: Run tests
        run: pytest --cov=odyssey_core --cov-report=xml:coverage.xml

      - name: Validate canonical note schema
        run: python scripts/validate_note_schema.py

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
