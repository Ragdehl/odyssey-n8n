name: Python CI

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-ci:
    name: Python deterministic checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install development requirements
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check odyssey_core odyssey_runtime scripts tests

      - name: Check formatting
        run: ruff format --check odyssey_core odyssey_runtime scripts tests

      - name: Run tests
        run: pytest --cov=odyssey_core --cov=odyssey_runtime --cov-report=xml:coverage.xml

      - name: Check Odyssey web JavaScript
        run: |
          node --check odyssey_web/client.js
          node --check odyssey_web/app.js
          node --test --experimental-test-coverage --test-coverage-lines=80 tests/odyssey_web_client.test.mjs

      - name: Validate canonical note schema
        run: python scripts/validate_note_schema.py

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Diagnose Sonar PR issues
        if: ${{ github.event_name == 'pull_request' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          query = urllib.parse.urlencode(
              {
                  "componentKeys": "Ragdehl_odyssey-n8n",
                  "pullRequest": os.environ["PR_NUMBER"],
                  "resolved": "false",
                  "ps": "100",
              }
          )
          request = urllib.request.Request(
              f"https://sonarcloud.io/api/issues/search?{query}",
              headers={"Authorization": f"Bearer {os.environ['SONAR_TOKEN']}"},
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)

          issues = payload.get("issues", [])
          print(f"Sonar open PR issues: {len(issues)}")
          for issue in issues:
              component = issue.get("component", "")
              path = component.split(":", 1)[-1]
              print(
                  json.dumps(
                      {
                          "path": path,
                          "line": issue.get("line"),
                          "rule": issue.get("rule"),
                          "severity": issue.get("severity"),
                          "type": issue.get("type"),
                          "message": issue.get("message"),
                      },
                      ensure_ascii=False,
                      sort_keys=True,
                  )
              )
          PY
