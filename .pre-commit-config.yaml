repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]

  - repo: local
    hooks:
      - id: pytest
        name: Odyssey active cross-surface gate
        entry: bash -c 'unset $(git rev-parse --local-env-vars); exec python scripts/odyssey_cross_surface_gate.py'
        language: python
        # The authoritative current regression matrix selects live contracts and
        # excludes historical frozen-model tests; plain 'pytest' is still
        # available as an exploratory diagnostic but is not the commit gate.
        # Provider client is still needed for provider-free contract tests.
        additional_dependencies: [pytest==9.1.1, openai==3.3.1]
        pass_filenames: false
        always_run: true
      - id: validate-note-schema
        name: validate canonical note schema
        entry: python scripts/validate_note_schema.py
        language: python
        pass_filenames: false
        always_run: true
