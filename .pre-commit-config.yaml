repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: python
        additional_dependencies: [pytest==9.1.1]
        pass_filenames: false
        always_run: true
      - id: validate-note-schema
        name: validate canonical note schema
        entry: python scripts/validate_note_schema.py
        language: system
        pass_filenames: false
        always_run: true
