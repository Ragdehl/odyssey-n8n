repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: bash -c 'unset $(git rev-parse --local-env-vars); exec pytest'
        language: python
        # The full suite imports the provider client in offline payload tests.
        # Keep this pinned to the repository's production SDK requirement.
        additional_dependencies: [pytest==9.1.1, openai==3.3.1]
        pass_filenames: false
        always_run: true
      - id: validate-note-schema
        name: validate canonical note schema
        entry: python scripts/validate_note_schema.py
        language: python
        pass_filenames: false
        always_run: true
