services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.33.7
    container_name: odyssey-dev-n8n
    restart: "no"
    network_mode: host
    environment:
      - TZ=Europe/Paris
      - GENERIC_TIMEZONE=Europe/Paris
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_HOST=odyssey-dev.ragdehl.com
      - N8N_LISTEN_ADDRESS=172.18.0.1
      - N8N_PORT=28780
      - N8N_PROTOCOL=https
      - N8N_EDITOR_BASE_URL=https://odyssey-dev.ragdehl.com/
      - N8N_WEBHOOK_URL=https://odyssey-dev.ragdehl.com/
      - N8N_ENDPOINT_WEBHOOK=api
      - N8N_PROXY_HOPS=1
      - N8N_SECURE_COOKIE=true
      - N8N_RESTRICT_FILE_ACCESS_TO=/odyssey-web
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      - odyssey-dev-n8n-data:/home/node/.n8n
      - /data/odyssey-dev/runtime/web:/odyssey-web:ro

volumes:
  odyssey-dev-n8n-data:
    external: true
