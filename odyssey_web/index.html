<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="odyssey-api-endpoint" content="/api/request">
  <meta name="odyssey-conversation-endpoint" content="/api/conversation">
  <meta name="odyssey-notes-endpoint" content="/api/notes">
  <meta name="odyssey-calendar-endpoint" content="/api/calendar">
  <title>Odyssey</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <section id="chat-surface" class="app-view chat-view" aria-labelledby="chat-title">
      <header class="app-header app-shell-header brand" aria-label="Odyssey">
        <h1 id="chat-title">Odyssey</h1>
        <nav class="app-surface-nav" aria-label="Aplicaciones">
          <button id="chat-home-tab" class="app-nav-button app-nav-chat" type="button" aria-label="Chat" title="Chat"></button>
          <button id="notes-tab" class="app-nav-button app-nav-notes" type="button" aria-label="Notas" title="Notas"></button>
          <button id="calendar-tab" class="app-nav-button app-nav-calendar" type="button" aria-label="Calendario" title="Calendario"></button>
        </nav>
      </header>
      <h2 id="composer-title" class="sr-only">Conversación con Odyssey</h2>
      <section id="interaction" class="conversation" aria-live="polite" aria-atomic="false"></section>

      <p id="clarification-status" class="clarification-status" hidden>Esperando tu elección o respuesta</p>
      <form id="odyssey-form" class="composer" novalidate>
        <label class="sr-only" for="request-input">Pregunta o dile algo a Odyssey</label>
        <textarea
          id="request-input"
          name="request"
          rows="1"
          placeholder="Pregunta o dile algo a Odyssey…"
          autocomplete="off"
          autocapitalize="sentences"
          enterkeyhint="enter"
          required
        ></textarea>
        <p id="input-hint" class="hint">Enter para enviar · Mayús+Enter para nueva línea</p>
        <button id="send-button" class="send-button" type="submit" aria-label="Enviar" title="Enviar"></button>
      </form>
    </section>
    <section id="notes-surface" class="app-view notes-workspace" aria-labelledby="notes-title" hidden>
      <header class="app-header app-shell-header notes-app-header">
        <h1 id="notes-title">Notas</h1>
        <nav class="app-surface-nav" aria-label="Aplicaciones">
          <button id="chat-tab" class="app-nav-button app-nav-chat" type="button" aria-label="Chat" title="Chat"></button>
          <button id="notes-home-tab" class="app-nav-button app-nav-notes" type="button" aria-label="Notas" title="Notas"></button>
          <button id="notes-calendar-tab" class="app-nav-button app-nav-calendar" type="button" aria-label="Calendario" title="Calendario"></button>
        </nav>
      </header>
      <section id="notes-list-view" class="notes-list-view" aria-label="Explorar notas">
        <div class="notes-controls">
          <button id="notes-filters" class="notes-filter-button" type="button" disabled>Filtros</button>
          <label class="notes-sort-label" for="notes-sort">Ordenar
            <select id="notes-sort">
              <option value="relevance">Relevancia</option>
              <option value="updated_desc">Actualizadas recientemente</option>
              <option value="created_desc">Creadas recientemente</option>
              <option value="created_asc">Creadas primero</option>
            </select>
          </label>
        </div>
        <div id="notes-filter-chips" class="notes-filter-chips" aria-label="Filtros activos"></div>
        <p id="notes-status" class="notes-status" aria-live="polite"></p>
        <section id="notes-list" class="notes-list" aria-label="Resultados de notas"></section>
      </section>
      <article id="note-detail" class="note-detail" hidden></article>
      <form id="notes-search-form" class="notes-search-dock" role="search" novalidate>
        <label class="sr-only" for="notes-search">Buscar notas</label>
        <input id="notes-search" type="search" placeholder="Buscar notas…" autocomplete="off">
        <button id="notes-intelligent" type="submit" aria-label="Búsqueda inteligente">✦</button>
      </form>
    </section>
    <section id="calendar-surface" class="app-view calendar-workspace" aria-labelledby="calendar-title" hidden>
      <header class="app-header app-shell-header calendar-app-header">
        <h1 id="calendar-title">Calendario</h1>
        <nav class="app-surface-nav" aria-label="Aplicaciones">
          <button id="calendar-chat-tab" class="app-nav-button app-nav-chat" type="button" aria-label="Chat" title="Chat"></button>
          <button id="calendar-notes-tab" class="app-nav-button app-nav-notes" type="button" aria-label="Notas" title="Notas"></button>
          <button id="calendar-home-tab" class="app-nav-button app-nav-calendar" type="button" aria-label="Calendario" title="Calendario"></button>
        </nav>
      </header>
      <nav id="calendar-view-switch" class="calendar-view-switch" aria-label="Vista de calendario">
        <button id="calendar-view-month" type="button" aria-pressed="true">Mes</button>
        <button id="calendar-view-7" type="button" aria-pressed="false">7 días</button>
        <button id="calendar-view-3" type="button" aria-pressed="false">3 días</button>
        <button id="calendar-view-1" type="button" aria-pressed="false">1 día</button>
      </nav>
      <p id="calendar-status" class="calendar-status" aria-live="polite"></p>
      <section id="calendar-month-view" class="calendar-month-view">
        <div class="calendar-month-controls">
          <button id="calendar-prev" type="button" aria-label="Mes anterior">‹</button>
          <h2 id="calendar-month-title"></h2>
          <button id="calendar-next" type="button" aria-label="Mes siguiente">›</button>
          <button id="calendar-today" type="button">Hoy</button>
          <button id="calendar-expand" type="button" aria-label="Vista ampliada" aria-pressed="false" title="Vista ampliada">⛶</button>
        </div>
        <div id="calendar-grid" class="calendar-grid" aria-label="Vista mensual"></div>
      </section>
      <section id="calendar-schedule-view" class="calendar-schedule-view" hidden>
        <div class="calendar-schedule-controls">
          <button id="calendar-schedule-prev" type="button" aria-label="Periodo anterior">‹</button>
          <h2 id="calendar-schedule-title"></h2>
          <button id="calendar-schedule-next" type="button" aria-label="Periodo siguiente">›</button>
          <button id="calendar-schedule-today" type="button">Hoy</button>
        </div>
        <div id="calendar-schedule-grid" class="calendar-schedule-grid" aria-label="Agenda por horas"></div>
      </section>
      <article id="calendar-day-view" class="calendar-day-view" hidden></article>
    </section>
  </main>

  <dialog id="notes-filter-sheet" class="notes-filter-sheet" aria-labelledby="notes-filter-title">
    <header class="notes-filter-sheet-header">
      <h2 id="notes-filter-title">Filtros</h2>
      <button id="notes-filter-close" class="detail-close" type="button" aria-label="Cerrar filtros">×</button>
    </header>
    <form id="notes-filter-form" class="notes-filter-form">
      <div id="notes-filter-fields"></div>
      <div class="notes-filter-actions">
        <button id="notes-filter-clear" class="filter-secondary" type="button">Limpiar</button>
        <button type="submit">Aplicar filtros</button>
      </div>
    </form>
  </dialog>

  <dialog id="request-detail-sheet" class="request-detail-sheet" aria-labelledby="request-detail-title">
    <div class="request-detail-header">
      <h2 id="request-detail-title">Detalles de la solicitud</h2>
      <button id="request-detail-close" class="detail-close" type="button" aria-label="Cerrar detalles">×</button>
    </div>
    <div id="request-detail-content" class="request-detail-content"></div>
  </dialog>

  <script src="./environment.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
