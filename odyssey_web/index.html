<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="odyssey-api-endpoint" content="/api/request">
  <meta name="odyssey-conversation-endpoint" content="/api/conversation">
  <title>Odyssey</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header class="brand" aria-label="Odyssey">
      <div class="brand-mark" aria-hidden="true">O</div>
      <div>
        <h1>Odyssey</h1>
        <p>Tu memoria, cuando la necesitas.</p>
      </div>
    </header>

    <section class="workspace" aria-labelledby="composer-title">
      <div class="chat-toolbar">
        <h2 id="composer-title">Chats</h2>
        <button id="new-conversation" type="button" class="secondary-button">Nuevo chat</button>
      </div>
      <nav id="conversation-list" class="conversation-list" aria-label="Conversaciones guardadas"></nav>
      <section id="interaction" class="conversation" aria-live="polite" aria-atomic="false"></section>

      <form id="odyssey-form" class="composer" novalidate>
        <label class="sr-only" for="request-input">Pregunta o dile algo a Odyssey</label>
        <textarea
          id="request-input"
          name="request"
          rows="1"
          placeholder="Pregunta o dile algo a Odyssey…"
          autocomplete="off"
          autocapitalize="sentences"
          enterkeyhint="enter"
          required
        ></textarea>
        <p id="input-hint" class="hint">Enter para enviar · Mayús+Enter para nueva línea</p>
        <button id="send-button" type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <dialog id="request-detail-sheet" class="request-detail-sheet" aria-labelledby="request-detail-title">
    <div class="request-detail-header">
      <h2 id="request-detail-title">Detalles de la solicitud</h2>
      <button id="request-detail-close" class="detail-close" type="button" aria-label="Cerrar detalles">×</button>
    </div>
    <div id="request-detail-content" class="request-detail-content"></div>
  </dialog>

  <script src="./environment.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
